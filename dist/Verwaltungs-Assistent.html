<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verwaltungs-Assistent</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1d2733; --muted:#6b7785; --line:#dde3ea; --line2:#eef1f5;
  --pri:#1f5fa8; --pri-ink:#fff; --pri-soft:color-mix(in srgb,var(--pri) 12%,#fff);
  --rot:#c62828; --rot-soft:#fdecea; --gelb:#b26a00; --gelb-soft:#fff4dc; --gruen:#2e7d32; --gruen-soft:#e7f4e8; --blau-soft:#e6eff9;
  --opos:#1f5fa8; --ih:#8a4fbf; --kaution:#00897b;
  --r:8px; --sh:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs,14.5px)/1.45 Calibri,Carlito,'Segoe UI',Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h2,h3{margin:0 0 .6em;font-weight:700} h2{font-size:1.25rem} h3{font-size:1.05rem}
.muted{color:var(--muted)} .small,small{font-size:.86em} .nw{white-space:nowrap} .r{text-align:right} .pre{white-space:pre-wrap}
.rot-t{color:var(--rot)} .gruen-t{color:var(--gruen)}

/* Kopf + Navigation */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--kopf,#15385f);color:#fff;position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;line-height:1.15} .brand b{font-size:1.15rem} .brand span{font-size:.85rem;opacity:.75}
.suche{margin-left:auto;position:relative;width:min(420px,50vw)}
.suche input{width:100%;padding:7px 12px;border-radius:20px;border:0;background:rgba(255,255,255,.14);color:#fff}
.suche input::placeholder{color:rgba(255,255,255,.7)} .suche input:focus{outline:2px solid #8cc0ff;background:#fff;color:var(--ink)}
#sucheErg{position:absolute;top:110%;left:0;right:0;background:#fff;color:var(--ink);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.2);max-height:60vh;overflow:auto;z-index:30}
#sucheErg button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--line2)}
#sucheErg button:hover,#sucheErg button:first-child{background:var(--pri-soft)} #sucheErg small{display:inline-block;min-width:92px;color:var(--muted)}
.pad{padding:10px}
#nav{display:flex;gap:2px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:19;overflow-x:auto}
#nav button{border:0;background:none;padding:11px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
#nav button:hover{color:var(--ink)} #nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
.badge{display:inline-block;margin-left:6px;background:var(--rot);color:#fff;border-radius:10px;padding:0 6px;font-size:.78rem;line-height:1.5}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}

/* Karten, Layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px} .cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cols2>.card,.cols3>.card{margin-bottom:16px}
@media (max-width:1100px){.cols3{grid-template-columns:1fr 1fr}} @media (max-width:800px){.cols2,.cols3{grid-template-columns:1fr}}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px} .toolbar h2,.toolbar h3{margin:0 8px 0 0} .sp{flex:1}
.toolbar input[type=search]{min-width:220px}
.detailkopf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px} .detailkopf h2{margin:0}
.subtabs{display:flex;gap:6px;margin-bottom:12px} .subtabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;cursor:pointer} .subtabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap} .actions.left{justify-content:flex-start}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-size:1.7rem;font-weight:700;line-height:1.2}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0} dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.leer{padding:22px;text-align:center;color:var(--muted);background:var(--line2);border-radius:var(--r)}
.banner{padding:10px 14px;border-radius:var(--r);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner.warn{background:var(--gelb-soft);border:1px solid #f0d49a} .banner.err{background:var(--rot-soft);border:1px solid #f3b9b3}
.pruef{background:var(--gruen-soft);border-left:4px solid var(--gruen);padding:8px 10px;border-radius:4px;margin-top:10px} .pruef.rot{background:var(--rot-soft);border-color:var(--rot)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:.85em;background:#fff}

/* Buttons & Formulare */
button,.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;line-height:1.3;display:inline-flex;align-items:center;gap:4px}
button:hover,.btn:hover{border-color:#b7c3d1;background:#f8fafc} button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)} button.primary:hover{filter:brightness(.9)}
button.ghost{background:transparent} button.del{color:var(--rot)} button.ok{color:var(--gruen)}
button.s{padding:2px 8px;font-size:.88em;margin-left:3px}
input,select,textarea{border:1px solid #c9d2dc;border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc2ef;border-color:var(--pri)}
textarea{width:100%;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px} .fld>span{font-size:.88em;color:var(--muted);font-weight:600} .fld input,.fld select,.fld textarea{width:100%}
.fld small{color:var(--muted)} .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer} .chk input{width:auto}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 10px;max-height:260px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:6px}
@media (max-width:600px){.grid{grid-template-columns:1fr}}

/* Tabellen */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.82rem;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tfoot td{border-top:2px solid var(--line);border-bottom:0}
.tbl tr.klick{cursor:pointer} .tbl tr.klick:hover td{background:#f6f9fd}
.tbl tr.done td{color:var(--muted)} .tbl tr.done td b{font-weight:400}
.tbl tr.ueber td:first-child{box-shadow:inset 3px 0 var(--rot)} .tbl tr.ueber td:first-child b{color:var(--rot)}
.tbl tr.heute td:first-child{box-shadow:inset 3px 0 var(--gelb)} .tbl tr.heute td:first-child b{color:var(--gelb)}
.tbl tr.aktiv td{background:var(--gruen-soft)}
.tbl.small td,.tbl.small th{padding:3px 6px;font-size:.85rem}
.tbl.rechner td{padding:4px 6px}
.scrollx{overflow-x:auto;margin-bottom:10px}

/* Chips */
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.8rem;font-weight:600;background:var(--line2);color:#3b4755;white-space:nowrap}
.chip.rot{background:var(--rot-soft);color:var(--rot)} .chip.gelb{background:var(--gelb-soft);color:var(--gelb)} .chip.gruen{background:var(--gruen-soft);color:var(--gruen)} .chip.blau{background:var(--blau-soft);color:var(--pri)}
.chip.b-opos{background:#e6eff9;color:var(--opos)} .chip.b-ih{background:#f3eafa;color:var(--ih)} .chip.b-kaution{background:#e0f2f0;color:var(--kaution)}
.chip.st-erinnerung{background:#eef3ff;color:#3a5bb8} .chip.st-mahnung1{background:var(--gelb-soft);color:var(--gelb)} .chip.st-mahnungLetzte{background:#ffe7d6;color:#c2410c}
.chip.st-kuendigung,.chip.st-anwalt{background:var(--rot-soft);color:var(--rot)} .chip.st-erledigt{background:var(--gruen-soft);color:var(--gruen)}
.chip.dr-notfall{background:var(--rot);color:#fff} .chip.dr-hoch{background:#ffe7d6;color:#c2410c}
.chip.is-erledigt,.chip.is-abgerechnet,.chip.ks-ausgezahlt{background:var(--gruen-soft);color:var(--gruen)} .chip.is-beauftragt,.chip.is-in_arbeit,.chip.ks-abgerechnet{background:var(--blau-soft);color:var(--pri)} .chip.ks-in_pruefung{background:var(--gelb-soft);color:var(--gelb)}
.wvdate{font-weight:600} .wvdate.rot{color:var(--rot)} .wvdate.gelb{color:var(--gelb)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#c3cad3} .dot.rot{background:var(--rot)} .dot.gelb{background:#f0a500} .dot.gruen{background:var(--gruen)}
.ampel-rot{border-left:5px solid var(--rot)} .ampel-gelb{border-left:5px solid #f0a500} .ampel-gruen{border-left:5px solid var(--gruen)}

/* Dashboard */
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kachel{flex-direction:column;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh);text-align:left}
.kachel b{font-size:1.6rem;line-height:1.1} .kachel span{color:var(--muted);font-size:.9rem}
.kachel.rot{border-color:#f3b9b3;background:var(--rot-soft)} .kachel.rot b{color:var(--rot)} .kachel.gelb{border-color:#f0d49a;background:var(--gelb-soft)} .kachel.gelb b{color:var(--gelb)}
.kachel.rot-t b{color:var(--rot);font-size:1.3rem} .kachel.b-opos{border-top:3px solid var(--opos)} .kachel.b-ih{border-top:3px solid var(--ih)} .kachel.b-kaution{border-top:3px solid var(--kaution)}

/* IH */
.pipeline{display:flex;margin-bottom:16px;overflow-x:auto}
.pipeline span{flex:1;text-align:center;padding:7px 10px;background:#fff;border:1px solid var(--line);font-size:.88rem;color:var(--muted);white-space:nowrap}
.pipeline span:first-child{border-radius:var(--r) 0 0 var(--r)} .pipeline span:last-child{border-radius:0 var(--r) var(--r) 0}
.pipeline span.done{background:var(--gruen-soft);color:var(--gruen)} .pipeline span.on{background:var(--pri);color:#fff;font-weight:700;border-color:var(--pri)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:8px}
.fotos figure{margin:0;position:relative} .fotos img{width:100%;height:80px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--line)}
.fotos figure button{position:absolute;top:2px;right:2px;background:#fff}
.drop{display:block;border:2px dashed #c3cdd8;border-radius:var(--r);padding:14px;text-align:center;color:var(--muted);cursor:pointer} .drop.over{border-color:var(--pri);background:var(--pri-soft)}

/* Verlauf */
ul.verlauf{list-style:none;padding:0;margin:0 0 8px;max-height:320px;overflow:auto} ul.verlauf li{padding:5px 0;border-bottom:1px solid var(--line2)} ul.verlauf li span{color:var(--muted);margin-right:8px}

/* Einstellungen */
.vorlagen{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media (max-width:1000px){.vorlagen{grid-template-columns:1fr}}
.platzhalter{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px} .platzhalter button{font-family:Consolas,monospace;font-size:.78rem;margin:0}
.logoprev{max-height:50px;max-width:180px;border:1px solid var(--line);padding:3px;background:#fff}
details summary{cursor:pointer;color:var(--pri);margin-top:10px}

/* Dialog */
dialog{border:0;border-radius:12px;padding:0;width:min(640px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(980px,96vw)} dialog::backdrop{background:rgba(15,30,50,.45)}
dialog form{display:flex;flex-direction:column;max-height:92vh}
dialog header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)} dialog header h3{margin:0}
dialog header .x{border:0;font-size:1.5rem;line-height:1;padding:0 6px;background:none}
.mbody{padding:16px 18px;overflow:auto} .mbody p:first-child{margin-top:0}
dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 12px 12px;flex-wrap:wrap}
dialog.docdlg{width:min(1000px,97vw)} dialog.docdlg .mbody{padding:10px 14px}
.doctool{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px} .doctool label{display:flex;gap:6px;align-items:center} .doctool .grow{flex:1} .doctool .grow input{flex:1}
.docframe{width:100%;height:68vh;border:1px solid var(--line);border-radius:6px;background:#dfe4ea}
.docframe.small{height:720px}

/* Toasts */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:1000;max-width:min(460px,90vw)}
.toast{background:#1d2733;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .35s,transform .35s}
.toast.warn{background:#8a5300} .toast.err{background:var(--rot)} .toast.weg{opacity:0;transform:translateY(8px)}

@media print{.top,#nav,#toasts{display:none} main{padding:0} .card{box-shadow:none;border:0}}

/* Anpassbar */
.wvbtns{display:inline-flex;gap:0;margin-right:4px} .wvbtns button.s{margin-left:-1px;border-radius:0} .wvbtns button.s:first-child{border-radius:5px 0 0 5px} .wvbtns button.s:last-child{border-radius:0 5px 5px 0}
.wvbtns button.mehr{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px} .chips button{margin:0}
input[type=color]{height:34px;padding:2px;width:80px}
body.kompakt .tbl td{padding:3px 6px} body.kompakt .tbl th{padding:4px 6px} body.kompakt .card{padding:10px 12px;margin-bottom:10px} body.kompakt main{padding-top:10px}

/* Aufstellung offener Posten */
.aufstellung{display:grid;grid-template-columns:1fr;gap:3px;max-width:620px;background:var(--line2);border-radius:var(--r);padding:10px 14px;margin-bottom:10px}
.aufstellung div{display:flex;justify-content:space-between;gap:10px} .aufstellung .summe{border-top:2px solid var(--line);padding-top:4px;grid-column:1/-1;font-size:1.05em}
.chip.ty-miete{background:#eef3ff;color:#3a5bb8} .chip.ty-gutschrift{background:var(--gruen-soft);color:var(--gruen)} .chip.ty-sonstig{background:var(--gelb-soft);color:var(--gelb)}
.multi b{font-weight:600}
.multi.liste{grid-template-columns:1fr;gap:0;padding:0} .multi.liste label{display:flex;gap:8px;padding:4px 8px;border-bottom:1px solid var(--line2)} .multi.liste label:hover{background:var(--pri-soft)} .multi.liste b{margin-left:auto;white-space:nowrap}
.card.naechster{border-left:4px solid var(--pri)} .card.naechster dl.kv{margin:0 0 8px}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Verwaltungs-Assistent</b><span id="firmaKopf"></span></div>
  <div class="suche"><input id="suche" type="search" placeholder="Suchen … (Strg+K)" autocomplete="off" aria-label="Globale Suche"><div id="sucheErg" hidden></div></div>
</header>
<nav id="nav"></nav>
<main id="main"><p>Wird geladen …</p></main>
<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px">Bitte JavaScript aktivieren.</p></noscript>
<script>
/* ===== core.js ===== */
/* ============================================================
 * core – Datum/Werktag/Feiertage, Formatierung, Datenmodell,
 * Migration, WV-Engine, Fachlogik (Kündigungscheck, Zahlungs-
 * verteilung, Kautionsrechnung, Raten, Import, Vorlagen-Rendering).
 * Rein funktional, läuft im Browser (window.Core) und in Node.
 * ============================================================ */
(function (root) {
  'use strict';

  const STORE_KEY = 'verwaltung_v1';
  const PROTOTYP_KEY = 'opos_assistent_v1';
  const DATA_VERSION = 1;

  /* ---------- Datum ---------- */
  const pad = n => String(n).padStart(2, '0');
  function isoFromDate(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function dateFromISO(s) { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function today() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function isISO(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }
  function addDays(iso, n) { const d = dateFromISO(iso); d.setUTCDate(d.getUTCDate() + n); return isoFromDate(d); }
  function addMonths(iso, n) {
    const d = dateFromISO(iso); const day = d.getUTCDate();
    d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n);
    const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    d.setUTCDate(Math.min(day, last)); return isoFromDate(d);
  }
  function endOfMonth(iso) { const d = dateFromISO(iso); return isoFromDate(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0))); }
  /** Tage von a bis b (b − a) */
  function diffDays(a, b) { return Math.round((dateFromISO(b) - dateFromISO(a)) / 86400000); }
  function maxISO(a, b) { return a > b ? a : b; }

  function easterSunday(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return y + '-' + pad(month) + '-' + pad(day);
  }
  const _feiertagCache = {};
  /** Gesetzliche Feiertage NRW → { 'YYYY-MM-DD': 'Name' } */
  function feiertageNRW(y) {
    if (_feiertagCache[y]) return _feiertagCache[y];
    const e = easterSunday(y);
    const map = {};
    [[y + '-01-01', 'Neujahr'], [addDays(e, -2), 'Karfreitag'], [addDays(e, 1), 'Ostermontag'],
     [y + '-05-01', 'Tag der Arbeit'], [addDays(e, 39), 'Christi Himmelfahrt'], [addDays(e, 50), 'Pfingstmontag'],
     [addDays(e, 60), 'Fronleichnam'], [y + '-10-03', 'Tag der Deutschen Einheit'], [y + '-11-01', 'Allerheiligen'],
     [y + '-12-25', '1. Weihnachtstag'], [y + '-12-26', '2. Weihnachtstag']].forEach(([d, n]) => { map[d] = n; });
    return (_feiertagCache[y] = map);
  }
  function feiertagName(iso) { return feiertageNRW(+String(iso).slice(0, 4))[iso] || null; }
  function isWochenende(iso) { const w = dateFromISO(iso).getUTCDay(); return w === 0 || w === 6; }
  /** Werktag im Sinne der WV: Mo–Fr, kein NRW-Feiertag */
  function isWerktag(iso, nrw = true) { return !isWochenende(iso) && !(nrw && feiertagName(iso)); }
  function naechsterWerktag(iso, nrw = true) { let d = iso; while (!isWerktag(d, nrw)) d = addDays(d, 1); return d; }
  function vorherigerWerktag(iso, nrw = true) { let d = iso; while (!isWerktag(d, nrw)) d = addDays(d, -1); return d; }
  function addWerktage(iso, n, nrw = true) { let d = iso, c = 0; while (c < n) { d = addDays(d, 1); if (isWerktag(d, nrw)) c++; } return d; }

  /**
   * Termin der ordentlichen Kündigung durch den Vermieter (§ 573c Abs. 1 BGB).
   * Zugang bis zum 3. Werktag (Mo–Sa, konservativ) → Ablauf des übernächsten Monats;
   * +3 Monate nach 5 Jahren, +3 weitere nach 8 Jahren Mietdauer.
   */
  function ordentlicherKuendigungstermin(zugang, mietbeginn) {
    const ersterDesMonats = zugang.slice(0, 8) + '01';
    let d = ersterDesMonats, n = 0;
    for (;;) { if (dateFromISO(d).getUTCDay() !== 0 && !feiertagName(d)) { n++; if (n === 3) break; } d = addDays(d, 1); }
    let monate = zugang <= d ? 2 : 3;
    if (mietbeginn && isISO(mietbeginn)) {
      const dauerMonate = (dateFromISO(zugang).getUTCFullYear() - dateFromISO(mietbeginn).getUTCFullYear()) * 12 +

    s = String(s).trim(); let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
    if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/))) { let y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad(m[2]) + '-' + pad(m[1]); }

  /* ---------- Migration Prototyp (opos_assistent_v1) ---------- */

  function migratePrototype(old) {

  /* ---------- Fachlogik ---------- */

  function offenSumme(posten, typ) { return sum((posten || []).filter(p => !typ || p.typ === typ), p => p.offen); }

  /**
   * Prüfhinweis Kündigung § 543 Abs. 2 S. 1 Nr. 3 BGB (nur Mietposten):
   *  a) zwei aufeinanderfolgende Termine, Rückstand > 1 Monatsmiete (§ 569 Abs. 3 Nr. 1)
   *  b) über mehr als zwei Termine Rückstand ≥ 2 Monatsmieten
   */
  function kuendigungsCheck(posten, monatsmiete) {
    monatsmiete = round2(monatsmiete);
    const miete = nettoPosten(posten).filter(p => p.typ === 'miete' && round2(p.offen) > 0);
    const summeMiete = sum(miete, p => p.offen);
    const proMonat = {};
    miete.forEach(p => { const k = String(p.faellig || '').slice(0, 7); if (k) proMonat[k] = round2((proMonat[k] || 0) + Number(p.offen)); });
    const monate = Object.keys(proMonat).sort();
    let a = null;
    if (monatsmiete > 0) {
      for (let i = 0; i < monate.length - 1; i++) {
        if (addMonths(monate[i] + '-01', 1).slice(0, 7) !== monate[i + 1]) continue;
        const s = round2(proMonat[monate[i]] + proMonat[monate[i + 1]]);
        if (s > monatsmiete) { a = { von: monate[i], bis: monate[i + 1], summe: s }; break; }
      }
    }
    const b = monatsmiete > 0 && summeMiete >= round2(2 * monatsmiete);
    let text;
    if (!(monatsmiete > 0)) text = 'Keine Monatsmiete hinterlegt – Prüfung nicht möglich.';
    else if (a && b) text = 'Voraussetzungen Nr. 3 a) und b) scheinen erfüllt.';
    else if (a) text = 'Voraussetzung Nr. 3 a) scheint erfüllt (zwei aufeinanderfolgende Termine, Rückstand > 1 Monatsmiete).';
    else if (b) text = 'Voraussetzung Nr. 3 b) scheint erfüllt (Rückstand ≥ 2 Monatsmieten).';
    else text = 'Voraussetzungen der fristlosen Kündigung wegen Zahlungsverzugs derzeit nicht erkennbar.';
    let grund = '';
    if (b) grund = 'den Betrag von zwei Monatsmieten (' + fmtEUR(2 * monatsmiete) + ')';
    else if (a) grund = 'für die zwei aufeinanderfolgenden Termine ' + monatLabel(a.von) + ' und ' + monatLabel(a.bis) + ' den Betrag einer Monatsmiete (' + fmtEUR(monatsmiete) + ')';
    const saldoOffen = sum((posten || []).filter(p => p.saldo), p => p.offen);
    if (saldoOffen > 0) text += ' Achtung: ' + fmtEUR(saldoOffen) + ' stammen aus dem Saldo der OPOS-Liste ohne Aufschlüsselung und werden nicht als Miete gewertet – für die Prüfung die Einzelposten erfassen oder importieren.';
    return { moeglich: !!(a || b), a, b, summeMiete, monatsmiete, saldoOffen, text, grund, hinweis: 'Prüfhinweis – ersetzt keine rechtliche Prüfung.' };
  }
  function monatLabel(ym) {
    const n = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const [y, m] = ym.split('-'); return n[+m - 1] + ' ' + y;
  }

  /** Zahlung verteilen: älteste Posten zuerst. Gibt neue Posten-Liste, Rest und Buchungen zurück. */
  function verteileZahlung(posten, betrag) {
    const list = (posten || []).map(p => Object.assign({}, p));
    let rest = round2(betrag);
    const order = list.map((p, i) => i).filter(i => round2(list[i].offen) > 0)
      .sort((x, y) => (list[x].faellig || '9999').localeCompare(list[y].faellig || '9999') || x - y);
    const buchungen = [];
    for (const i of order) {
      if (rest <= 0) break;
      const t = Math.min(rest, round2(list[i].offen));
      list[i].offen = round2(list[i].offen - t); rest = round2(rest - t);
      buchungen.push({ id: list[i].id, bez: list[i].bez, betrag: t });
    }
    return { posten: list, rest, buchungen };
  }

  /** Kaution + Zinsen − Einbehalte − NK-Einbehalt = Auszahlung */
  function kautionsabrechnung(k) {
    const kaution = round2(k.betrag), zinsen = round2(k.zinsen);
    const guthaben = round2(kaution + zinsen);
    const einbehalte = sum(k.einbehalte, e => e.betrag);
    const nkEinbehalt = round2(k.nkEinbehalt);
    const bereitsAusgezahlt = round2(k.teilauszahlung);
    const auszahlung = round2(guthaben - einbehalte - nkEinbehalt - bereitsAusgezahlt);
    return { kaution, zinsen, guthaben, einbehalte, nkEinbehalt, bereitsAusgezahlt, auszahlung, nachforderung: auszahlung < 0 ? -auszahlung : 0 };
  }
  /** Verjährung § 548 BGB: 6 Monate ab Rückgabe der Mietsache */
  function verjaehrung(k, heute = today()) {
    const basis = k.uebergabeAm || k.auszugAm;
    if (!basis) return null;
    const ende = addMonths(basis, 6);
    return { basis, ende, restTage: diffDays(heute, ende), seitUebergabe: diffDays(basis, heute) };
  }
  function kautionAmpel(k, heute = today(), warnTage = 30) {
    if (k.status === 'ausgezahlt') return 'grau';
    const v = verjaehrung(k, heute);
    if (!v) return 'grau';
    if (v.restTage < warnTage) return 'rot';
    if (v.seitUebergabe > 90) return 'gelb';
    return 'gruen';
  }

  function ratenplan(summe, anzahl, ersteFaellig, intervallMonate = 1) {
    const n = Math.max(1, anzahl | 0); summe = round2(summe);
    const basis = Math.floor(summe * 100 / n) / 100;
    const raten = []; let acc = 0;
    for (let i = 0; i < n; i++) {
      const betrag = i === n - 1 ? round2(summe - acc) : basis;
      acc = round2(acc + betrag);
      raten.push({ nr: i + 1, faellig: addMonths(ersteFaellig, i * intervallMonate), betrag, bezahlt: false });
    }
    return raten;
  }

  /* ---------- WV-Engine ---------- */
  /** WV nie auf Wochenende/Feiertag: auf nächsten Werktag, bei Fristsicherung (vorziehen) auf vorherigen */
  function wvDatum(data, iso, vorziehen) { const nrw = data.settings.feiertageNRW !== false; return vorziehen ? vorherigerWerktag(iso, nrw) : naechsterWerktag(iso, nrw); }
  function createWV(data, bereich, refId, datum, aufgabe, opts = {}) {
    const w = { id: uid(), bereich, refId, datum: wvDatum(data, datum, opts.vorziehen), aufgabe, status: 'offen',
      erstelltDurch: opts.erstelltDurch || 'auto', regel: opts.regel || '', erstelltAm: opts.heute || today() };
    data.wv.push(w); return w;
  }
  function completeWV(data, id, am = today()) {
    const w = data.wv.find(x => x.id === id); if (!w) return null;
    w.status = 'erledigt'; w.erledigtAm = am; return w;
  }
  /** WV verschieben: ab WV-Datum (bzw. heute, falls überfällig) um n Tage/Werktage/Wochen/Monate */
  function snoozeWV(data, id, n, heute = today(), einheit = 'tage') {
    const w = data.wv.find(x => x.id === id); if (!w) return null;
    w.datum = wvDatum(data, plusEinheit(maxISO(w.datum, heute), n, einheit, data.settings.feiertageNRW !== false)); return w;
  }
  function setWVDatum(data, id, iso) { const w = data.wv.find(x => x.id === id); if (!w) return null; w.datum = wvDatum(data, iso); return w; }
  /** Offene Auto-WV eines Falls schließen. regeln: true = alle, Array = nur diese Regeln */
  function closeWV(data, bereich, refId, regeln = true, am = today()) {
    let n = 0;
    data.wv.forEach(w => {
      if (w.bereich !== bereich || w.refId !== refId || w.status !== 'offen' || w.erstelltDurch !== 'auto') return;
      if (regeln !== true && !regeln.includes(w.regel)) return;
      w.status = 'erledigt'; w.erledigtAm = am; w.erledigtDurch = 'auto'; n++;
    });
    return n;
  }
  function offeneWV(data, bereich, refId) {
    return data.wv.filter(w => w.status === 'offen' && (!bereich || w.bereich === bereich) && (!refId || w.refId === refId))
      .sort((a, b) => a.datum.localeCompare(b.datum));
  }
  function addVerlauf(data, bereich, refId, typ, text, datum = today()) {
    const v = { id: uid(), bereich, refId, datum, typ, text }; data.verlauf.push(v); return v;
  }

  const AKTIONEN = {
    opos: {
      erinnerung: 'Zahlungserinnerung versendet', mahnung1: '1. Mahnung versendet', mahnungLetzte: 'Letzte Mahnung versendet',
      abmahnung: 'Abmahnung (unpünktliche Zahlung) versendet', kuendigung: 'Kündigung versendet', anwalt: 'An Anwalt übergeben',
      raten: 'Ratenzahlung vereinbart', erledigt: 'Fall erledigt', emailMahnung: 'Mahnung per E-Mail versendet'
    },
    ih: {
      gemeldet: 'Schaden gemeldet', angefragt: 'Angebote angefragt', beauftragt: 'Handwerker beauftragt',
      in_arbeit: 'Arbeiten begonnen', erledigt: 'Arbeiten erledigt', abgerechnet: 'Rechnung geprüft / abgerechnet'
    },
    kaution: {
      auszug: 'Auszug / Wohnungsübergabe erfasst', uebergabe: 'Wohnungsübergabe erfasst', nkEinbehalt: 'NK-Einbehalt festgelegt',
      abrechnung: 'Kautionsabrechnung versendet', ausgezahlt: 'Kaution ausgezahlt'
    }
  };

  /**
   * Regeln je Aktion (Rahmenplan § 5). Liefert { schliessen, frist, neu:[{datum, aufgabe}] }.
   * Datumsangaben sind Rohwerte; createWV schiebt auf den nächsten Werktag.
   */
  function wvRegeln(data, bereich, aktion, ctx = {}) {
    const s = data.settings, f = s.fristen, P = Number(s.puffer) || 0, h = ctx.heute || today(), nrw = s.feiertageNRW !== false;
    switch (bereich + ':' + aktion) {
      case 'opos:erinnerung': case 'opos:mahnung1': case 'opos:mahnungLetzte': case 'opos:abmahnung': {
        const frist = ctx.frist || addDays(h, Number(f[aktion]) || 10);
        return { schliessen: true, frist, neu: [{ datum: addDays(frist, P), aufgabe: 'Zahlungseingang prüfen (' + (STUFEN[aktion] || 'Abmahnung') + ', Frist ' + fmtDatum(frist) + ')' }] };
      }
      case 'opos:emailMahnung': {
        const frist = ctx.frist || addDays(h, Number(f.emailMahnung) || 7);
        return { schliessen: true, frist, neu: [{ datum: addDays(frist, P), aufgabe: 'Zahlungseingang prüfen (E-Mail-Mahnung' + (ctx.abmahnung ? ' + Abmahnung' : '') + ', Frist ' + fmtDatum(frist) + ')' }] };
      }
      case 'opos:kuendigung': {
        const frist = ctx.frist || addDays(h, Number(f.kuendigung) || 14);
        return { schliessen: true, frist, neu: [
          { datum: frist, aufgabe: 'Räumung/Zahlung prüfen, ggf. Anwalt einschalten' },
          { datum: addDays(h, 2), aufgabe: 'Original der Kündigung per Post versendet?' }] };
      }
      case 'opos:anwalt':
        return { schliessen: true, neu: [{ datum: addDays(h, Number(f.anwalt) || 14), aufgabe: 'Sachstand beim Anwalt erfragen' }] };
      case 'opos:raten': {
        const r = ctx.raten || [];
        return { schliessen: true, neu: r.map(x => ({ datum: addDays(x.faellig, P), aufgabe: 'Rate ' + x.nr + '/' + r.length + ' (' + fmtEUR(x.betrag) + ', fällig ' + fmtDatum(x.faellig) + ') eingegangen?' })) };
      }
      case 'opos:erledigt': case 'ih:abgerechnet': case 'kaution:ausgezahlt':
        return { schliessen: true, neu: [] };
      case 'ih:gemeldet': {
        const d = ctx.dringlichkeit === 'notfall' ? h : ctx.dringlichkeit === 'hoch' ? addWerktage(h, 1, nrw) : addWerktage(h, 3, nrw);
        return { schliessen: false, neu: [{ datum: d, aufgabe: 'Handwerker anfragen' + (ctx.dringlichkeit === 'notfall' ? ' – NOTFALL' : '') }] };
      }
      case 'ih:angefragt':
        return { schliessen: ['ih:gemeldet', 'ih:angefragt'], neu: [{ datum: addDays(h, Number(f.angebot) || 5), aufgabe: 'Angebot eingegangen?' }] };
      case 'ih:beauftragt':
        return { schliessen: ['ih:gemeldet', 'ih:angefragt', 'ih:beauftragt'], neu: [{ datum: ctx.termin ? addDays(ctx.termin, 1) : addDays(h, Number(f.ausfuehrung) || 10), aufgabe: 'Ausführung prüfen' }] };
      case 'ih:in_arbeit':
        return { schliessen: false, neu: [] };
      case 'ih:erledigt':
        return { schliessen: true, neu: [{ datum: addDays(h, Number(f.rechnung) || 14), aufgabe: 'Rechnung da? Prüfen / ggf. an Mieter weiterbelasten' }] };
      case 'kaution:auszug': {
        const u = ctx.uebergabeAm || ctx.auszugAm || h;
        return { schliessen: ['kaution:auszug'], neu: [
          { datum: addDays(u, 1), aufgabe: 'Übergabeprotokoll prüfen' },
          { datum: addMonths(u, 5), vorziehen: true, aufgabe: 'Ansprüche sichern – Verjährung § 548 BGB (6 Monate) am ' + fmtDatum(addMonths(u, 6)) }] };
      }
      case 'kaution:uebergabe': {
        const u = ctx.uebergabeAm || h;
        return { schliessen: ['kaution:uebergabe'], neu: [{ datum: addMonths(u, Number(f.kautionAbrechnungMonate) || 3), aufgabe: 'Kautionsabrechnung erstellen' }] };
      }
      case 'kaution:nkEinbehalt':
        return { schliessen: ['kaution:nkEinbehalt'], neu: ctx.nkDatum ? [{ datum: ctx.nkDatum, aufgabe: 'NK-Einbehalt auflösen (Betriebskostenabrechnung)' }] : [] };
      case 'kaution:abrechnung':
        return { schliessen: ['kaution:uebergabe', 'kaution:abrechnung'], neu: [{ datum: addDays(h, Number(f.auszahlung) || 14), aufgabe: 'Auszahlung der Kaution erfolgt?' }] };
      default:
        return { schliessen: false, neu: [] };
    }
  }

  function fallListe(data, bereich) { return data[bereich]; }
  function findFall(data, bereich, id) { return (fallListe(data, bereich) || []).find(x => x.id === id); }

  /**
   * Aktion ausführen: vorherige WV schließen, neue WV anlegen, Verlauf schreiben, Status fortschreiben.
   */
  function applyAction(data, bereich, refId, aktion, ctx = {}) {
    const h = ctx.heute || today();
    const regel = wvRegeln(data, bereich, aktion, ctx);
    const geschlossen = regel.schliessen ? closeWV(data, bereich, refId, regel.schliessen, h) : 0;
    const neu = regel.neu.map(n => createWV(data, bereich, refId, n.datum, n.aufgabe, { regel: bereich + ':' + aktion, heute: h, vorziehen: n.vorziehen }));
    const fall = findFall(data, bereich, refId);
    if (fall) {
      if (bereich === 'opos' && STUFEN[aktion]) fall.stufe = aktion;
      if (bereich === 'opos' && (aktion === 'abmahnung' || (aktion === 'emailMahnung' && ctx.abmahnung))) fall.abmahnungAm = h;
      if (bereich === 'opos' && aktion === 'emailMahnung' && ['neu', 'erinnerung'].includes(fall.stufe)) fall.stufe = 'mahnung1';
      if (bereich === 'opos' && aktion === 'raten') fall.raten = ctx.raten || [];
      if (bereich === 'opos' && regel.frist) fall.frist = regel.frist;
      if (bereich === 'ih' && IH_STATUS[aktion]) fall.status = aktion;
      if (bereich === 'ih' && aktion === 'beauftragt') { fall.auftragAm = h; if (ctx.termin) fall.termin = ctx.termin; }
      if (bereich === 'kaution') {
        if (aktion === 'auszug') { fall.status = fall.status === 'offen' ? 'in_pruefung' : fall.status; }
        if (aktion === 'abrechnung') fall.status = 'abgerechnet';
        if (aktion === 'ausgezahlt') { fall.status = 'ausgezahlt'; fall.auszahlungAm = h; }
      }
    }
    const label = (AKTIONEN[bereich] && AKTIONEN[bereich][aktion]) || aktion;
    addVerlauf(data, bereich, refId, aktion, ctx.verlaufText || (label + (regel.frist ? ' (Frist ' + fmtDatum(regel.frist) + ')' : '')), h);
    return { frist: regel.frist, neu, geschlossen };
  }

  /* ---------- Vorlagen-Rendering ---------- */
  function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
  /** Textbaustein → HTML. Platzhalter {{a.b}}; Keys auf „Tabelle“ werden als HTML eingesetzt; **fett** */
  function vorlageZuHTML(tpl, ctx) {
    const parts = String(tpl || '').split(/(\{\{\s*[\w.]+\s*\}\})/);
    let html = parts.map((p, i) => {
      if (i % 2 === 0) return esc(p);
      const k = p.replace(/[{}\s]/g, ''); const v = getPath(ctx, k);
      if (v == null) return '<mark>' + esc(p) + '</mark>';
      return /Tabelle$/.test(k) ? '\u0000' + String(v).replace(/\n/g, '') + '\u0000' : esc(v);
    }).join('');
    html = html.replace(/\*\*([^*]+?)\*\*/g, '<b>$1</b>');
    return html.split(/\n[ \t]*\n/).map(par => {
      const t = par.trim(); if (!t) return '';
      if (/^\u0000[^\u0000]*\u0000$/.test(t)) return t.replace(/\u0000/g, '');
      return '<p>' + t.replace(/\u0000/g, '').replace(/\n/g, '<br>') + '</p>';
    }).join('\n');
  }
  /** Textbaustein → Klartext (E-Mail). „xyzTabelle“ wird durch „xyzListe“ ersetzt. */
  function vorlageZuText(tpl, ctx) {
    return String(tpl || '').replace(/\{\{\s*([\w.]+)\s*\}\}/g, (m, k) => {
      const v = getPath(ctx, /Tabelle$/.test(k) ? k.replace(/Tabelle$/, 'Liste') : k);
      return v == null ? m : String(v);
    }).replace(/\*\*([^*]+?)\*\*/g, '$1');
  }

  /* ---------- CSV / Import ---------- */
  function parseCSV(text) {
    text = String(text || '').replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const cnt = ch => (first.match(new RegExp('\\' + ch, 'g')) || []).length;
    const delim = [';', '\t', ','].sort((a, b) => cnt(b) - cnt(a))[0];
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim() !== ''));
  }
  const IMPORT_FELDER = {
    mietnr: { label: 'Mieternummer / Personenkonto', syn: ['mietnr', 'mieternr', 'mieternummer', 'personenkonto', 'konto', 'kontonr', 'vertragsnr', 'vertrag', 'debitor'] },
    name: { label: 'Mietername (vollständig)', syn: ['name', 'mieter', 'mietername', 'kunde', 'debitorname'] },
    vorname: { label: 'Vorname', syn: ['vorname'] },
    nachname: { label: 'Nachname', syn: ['nachname', 'familienname'] },
    objekt: { label: 'Objekt', syn: ['objekt', 'objektbezeichnung', 'liegenschaft', 'haus', 'objektnr', 'we'] },
    whg: { label: 'Wohnung / Lage', syn: ['whg', 'wohnung', 'lage', 'einheit', 'mieteinheit', 'ne'] },
    bez: { label: 'Bezeichnung / Buchungstext', syn: ['bez', 'bezeichnung', 'text', 'buchungstext', 'art', 'sollart', 'verwendungszweck'] },
    faellig: { label: 'Fälligkeit', syn: ['faellig', 'fällig', 'fälligkeit', 'faelligkeit', 'soll-datum', 'datum', 'belegdatum', 'monat'] },
    betrag: { label: 'Betrag (Soll)', syn: ['betrag', 'betrag€', 'betrageur', 'soll', 'sollbetrag', 'forderung'] },
    offen: { label: 'Offener Betrag', syn: ['offen', 'offenerbetrag', 'saldo', 'restbetrag', 'op', 'offen betrag'] },
    typ: { label: 'Typ (Miete/Sonstig)', syn: ['typ', 'kategorie', 'kostenart'] },
    miete: { label: 'Monatsmiete', syn: ['gesamtmiete', 'monatsmiete', 'miete', 'warmmiete', 'sollmiete'] },
    email: { label: 'E-Mail', syn: ['email', 'e-mail', 'mail'] }
  };
  function guessMapping(headers) {
    const norm = s => String(s || '').toLowerCase().replace(/[^a-zäöüß0-9-]/g, '');
    const map = {}; const used = new Set();
    Object.keys(IMPORT_FELDER).forEach(k => {
      for (const syn of IMPORT_FELDER[k].syn.map(norm)) {
        const idx = headers.findIndex((h, i) => !used.has(i) && norm(h) === syn);
        if (idx >= 0) { map[k] = idx; used.add(idx); break; }
      }
    });
    return map;
  }
  function typAusText(t) {
    t = String(t || '').toLowerCase();
    if (/sonst|\bnk\b|nebenkost|betriebskost|heizkost|abrechnung|nachzahlung|mahn|gebühr|gebuehr|schaden|kosten|zins/.test(t) && !/^miete|grundmiete|nettokalt|nutzungsentsch/.test(t)) return 'sonstig';
    return 'miete';
  }
  /** Offene Posten importieren. rows = Datenzeilen (ohne Kopf), mapping = {feld: spaltenIndex} */
  function importOPOS(data, rows, mapping, heute = today(), opts = {}) {
    const beruehrt = new Set();
    const stat = { mieterNeu: 0, objekteNeu: 0, faelleNeu: 0, postenNeu: 0, postenAktualisiert: 0, uebersprungen: 0 };
    const get = (r, k) => (mapping[k] != null && mapping[k] !== '' ? r[mapping[k]] : undefined);
    rows.forEach(r => {
      const betragRaw = get(r, 'betrag'), offenRaw = get(r, 'offen');
      const betrag = parseBetrag(betragRaw != null ? betragRaw : offenRaw);
      const offen = offenRaw != null ? parseBetrag(offenRaw) : betrag;
      let vorname = String(get(r, 'vorname') || '').trim(), nachname = String(get(r, 'nachname') || '').trim();
      const voll = String(get(r, 'name') || '').trim();
      if (!nachname && voll) {
        if (voll.includes(',')) { const [n, v] = voll.split(','); nachname = n.trim(); vorname = (v || '').trim(); }
        else { const p = voll.split(/\s+/); nachname = p.pop(); vorname = p.join(' '); }
      }
      const mietnr = String(get(r, 'mietnr') || '').trim();
      const fest = opts.mieterId ? data.mieter.find(x => x.id === opts.mieterId) : null;
      if (!(offen > 0) || (!fest && !mietnr && !nachname)) { stat.uebersprungen++; return; }
      const objName = String(get(r, 'objekt') || '').trim();
      let obj = objName ? data.objekte.find(o => o.bezeichnung.toLowerCase() === objName.toLowerCase()) : null;
      if (objName && !obj) { obj = { id: uid(), bezeichnung: objName, strasse: '', plzort: '', eigentuemer: '' }; data.objekte.push(obj); stat.objekteNeu++; }
      let m = fest || data.mieter.find(x => (mietnr && x.mietnr === mietnr) || (!mietnr && x.nachname === nachname && (x.vorname || '') === vorname && (!obj || x.objektId === obj.id)));
      if (!m) {
        m = { id: uid(), objektId: obj ? obj.id : '', whg: String(get(r, 'whg') || ''), anrede: '', vorname, nachname, anschrift: '', email: String(get(r, 'email') || ''), tel: '', mietnr, gesamtmiete: parseBetrag(get(r, 'miete') || 0), mietbeginn: '', mietende: '', kaution: 0 };
        data.mieter.push(m); stat.mieterNeu++;
      } else if (get(r, 'miete') && !m.gesamtmiete) m.gesamtmiete = parseBetrag(get(r, 'miete'));
      let fall = data.opos.find(f => f.mieterId === m.id && f.stufe !== 'erledigt');
      if (!fall) { fall = { id: uid(), mieterId: m.id, stufe: 'neu', posten: [], raten: [], notiz: '', angelegt: heute }; data.opos.push(fall); stat.faelleNeu++; addVerlauf(data, 'opos', fall.id, 'import', 'Fall durch Import angelegt', heute); }
      const bez = String(get(r, 'bez') || 'Offener Posten').trim();
      const faellig = parseDatum(get(r, 'faellig')) || parseDatum(get(r, 'datum')) || '';
      const typRaw = get(r, 'typ');
      const typ = typRaw != null ? (/sonst/i.test(typRaw) ? 'sonstig' : typAusText(typRaw)) : typAusText(bez);
      const dup = fall.posten.find(p => p.bez === bez && p.faellig === faellig && round2(p.betrag) === round2(betrag));
      if (dup) { if (round2(dup.offen) !== round2(offen)) { dup.offen = offen; stat.postenAktualisiert++; } }
      else { fall.posten.push({ id: uid(), bez, faellig, typ, betrag: betrag || offen, offen, quelle: 'import' }); stat.postenNeu++; }
      beruehrt.add(fall);
    });
    beruehrt.forEach(saldoAbgleich);
    return stat;
  }

  /* ---------- Import OPOS-Liste (Salden je Mieter) ---------- */
  function normName(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9ÄÖÜß]/g, ''); }
  function titleCase(s) { return String(s).toLowerCase().replace(/(^|[\s\-/'(])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()); }
  const FIRMA_RE = /(gmbh|mbh|\bug\b|\bag\b|\bkg\b|\bohg\b|\bgbr\b|e\.\s?v\.|gastronom|immobil|bauträger|concept|service|holding|brother|&)/i;
  /** „NACHNAME, VORNAME“ → Namensteile; Firmen bleiben unverändert */
  function nameAufteilen(raw) {
    raw = String(raw || '').trim().replace(/\s+/g, ' ');
    if (FIRMA_RE.test(raw)) return { anrede: 'Firma', vorname: '', nachname: raw };
    const i = raw.indexOf(',');
    if (i < 0) return { anrede: '', vorname: '', nachname: titleCase(raw) };
    return { anrede: '', nachname: titleCase(raw.slice(0, i).trim()), vorname: titleCase(raw.slice(i + 1).trim()) };
  }
  /** „01.03.25 - 31.07.26,“ → { von, bis } */
  function parseMietzeit(v) {
    if (v instanceof Date) return { von: parseDatum(v), bis: '' };
    const m = String(v || '').match(/(\d{1,2}\.\d{1,2}\.\d{2,4})\s*-\s*(\d{1,2}\.\d{1,2}\.\d{2,4})?/);
    return m ? { von: parseDatum(m[1]), bis: m[2] ? parseDatum(m[2]) : '' } : { von: '', bis: '' };
  }
  /** Saldo aus Zahl, „=1.2-3“, „7000 ca.“, „1400€ offen“ */
  function parseSaldo(v) {
    if (typeof v === 'number') return round2(v);
    const s = String(v == null ? '' : v).trim();
    if (/^=\s*[\d.,+\-\s]+$/.test(s)) return round2((s.slice(1).replace(/,/g, '.').match(/[+-]?\s*\d+(\.\d+)?/g) || []).reduce((a, t) => a + parseFloat(t.replace(/\s/g, '')), 0));
    const m = s.match(/-?\d[\d.]*(,\d+)?/);
    return m ? parseBetrag(m[0]) : 0;
  }
  /** WV-Angabe aus Liste: Datum, „01.09“, „WV 30.09“ → ISO (Jahr aus Stichtag) */
  function parseWV(v, stand) {
    if (v == null || v === '') return '';
    if (v instanceof Date) return parseDatum(v);
    if (typeof v === 'number') return v > 30000 && v < 80000 ? parseDatum(String(v)) : '';
    const s = String(v).trim();
    let m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
    if (m) return parseDatum(m[0]);
    const mn = s.match(/(\d{1,2})\.\s*(Jan|Feb|Mär|Mrz|Mar|Apr|Mai|May|Jun|Jul|Aug|Sep|Okt|Oct|Nov|Dez|Dec)[a-zä]*\.?/i);
    if (mn) {
      const nr = { jan: 1, feb: 2, mär: 3, mrz: 3, mar: 3, apr: 4, mai: 5, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, okt: 10, oct: 10, nov: 11, dez: 12, dec: 12 }[mn[2].toLowerCase()];
      let iso = stand.slice(0, 4) + '-' + pad(nr) + '-' + pad(mn[1]);
      if (diffDays(iso, stand) > 90) iso = addMonths(iso, 12);

  const PLATZHALTER = [

  function vorlage(data, id) {
    const std = STANDARD[id]; const own = (data.vorlagen || {})[id] || {};
    return Object.assign({}, std, own, { id, geaendert: !!(own.betreff || own.text || own.email) });
  }

  /* ---------- Tabellen ---------- */
  function tabelle(kopf, zeilen, fuss, rechts = []) {
    const td = (v, i, tag = 'td') => '<' + tag + (rechts.includes(i) ? ' class="r"' : '') + '>' + v + '</' + tag + '>';
    return '<table class="bt"><thead><tr>' + kopf.map((k, i) => td(esc(k), i, 'th')).join('') + '</tr></thead><tbody>' +
      zeilen.map(z => '<tr>' + z.map((v, i) => td(esc(v), i)).join('') + '</tr>').join('') + '</tbody>' +
      (fuss ? '<tfoot><tr>' + fuss.map((v, i) => td(v === '' ? '' : '<b>' + esc(v) + '</b>', i)).join('') + '</tr></tfoot>' : '') + '</table>';
  }
  function postenTabelle(posten) {
    const offen = posten.filter(p => C.round2(p.offen) !== 0).sort((a, b) => (a.faellig || '').localeCompare(b.faellig || ''));
    return {
      html: tabelle(['Fällig', 'Bezeichnung', 'Betrag', 'offen'], offen.map(p => [fmtDatum(p.faellig), p.bez, fmtEUR(p.betrag), fmtEUR(p.offen)]), ['', 'Summe', '', fmtEUR(C.sum(offen, p => p.offen))], [2, 3]),
      text: offen.map(p => '- ' + fmtDatum(p.faellig) + '  ' + p.bez + ': ' + fmtEUR(p.offen)).join('\n') + '\nSumme: ' + fmtEUR(C.sum(offen, p => p.offen))
    };
  }

  /* ---------- Kontext für Platzhalter ---------- */
  function adresse(m, o) {
    if (!m) return [];
    const z = [];
    if (m.anrede && m.anrede !== 'Firma') z.push(m.anrede);
    z.push(C.mieterName(m));
    if (m.anschrift) z.push(...String(m.anschrift).split(/\n/));
    else if (o) { z.push(o.strasse + (m.whg ? ', ' + m.whg : '')); z.push(o.plzort); }
    return z.filter(Boolean);
  }
  function kontaktAdresse(k) { return k ? [k.firma, k.ansprechpartner, ...(String(k.anschrift || '').split(/\n/))].filter(Boolean) : []; }

  /** Kontext aufbauen. opts: { vorlageId, bereich, fall, frist, extra, empfaengerKontakt } */
  function kontext(data, opts) {
    const s = data.settings; const fall = opts.fall || {};
    const mieter = data.mieter.find(m => m.id === (fall.mieterId || opts.mieterId));
    const objekt = data.objekte.find(o => o.id === (fall.objektId || (mieter && mieter.objektId)));
    const hw = opts.empfaengerKontakt || data.kontakte.find(k => k.id === fall.handwerkerId);
    const m = mieter ? Object.assign({}, mieter, {
      name: C.mieterName(mieter), whgKomma: mieter.whg ? ', ' + mieter.whg : '', telKomma: mieter.tel ? ', Tel. ' + mieter.tel : ''
    }) : { name: '–', whgKomma: '', telKomma: '' };
    const o = objekt ? Object.assign({}, objekt, {
      eigentuemerOderVermieter: objekt.eigentuemer ? 'die Eigentümerin/den Eigentümer ' + objekt.eigentuemer : 'den Vermieter',
      eigentuemerGenitiv: objekt.eigentuemer ? 'der Eigentümerin/des Eigentümers ' + objekt.eigentuemer : 'des Vermieters'
    }) : { strasse: '', plzort: '', eigentuemerOderVermieter: 'den Vermieter', eigentuemerGenitiv: 'des Vermieters' };
    const ctx = {
      firma: s, sachbearbeiter: s.sachbearbeiter, datum: fmtDatum(C.today()), frist: fmtDatum(opts.frist || ''),
      mieter: m, objekt: o, briefanrede: C.briefanrede(mieter),
      handwerker: hw ? Object.assign({}, hw, { telKlammer: hw.tel ? ' (Tel. ' + hw.tel + ')' : '' }) : { firma: '–', telKlammer: '' },
      ratenVerzugTage: s.ratenVerzugTage
    };
    if (opts.bereich === 'opos') {
      const pt = postenTabelle(fall.posten || []);
      const summe = C.offenSumme(fall.posten || []);
      const geb = C.round2(s.mahngebuehr);
      const check = C.kuendigungsCheck(fall.posten || [], mieter && mieter.gesamtmiete);
      Object.assign(ctx, {
        postenTabelle: pt.html, postenListe: pt.text, summe: fmtEUR(summe), summeMiete: fmtEUR(check.summeMiete),
        summeGesamt: fmtEUR(summe + (['mahnung1', 'mahnungLetzte'].includes(opts.vorlageId) ? geb : 0)),
        mahngebuehrSatz: geb > 0 && ['mahnung1', 'mahnungLetzte'].includes(opts.vorlageId) ? ' Darin enthalten sind Mahnkosten in Höhe von ' + fmtEUR(geb) + '.' : '',
        kuendigungsgrund: check.grund || '[Kündigungsgrund prüfen!]',
        ordentlichZum: fmtDatum(C.ordentlicherKuendigungstermin(C.today(), mieter && mieter.mietbeginn)),
        abmahnungDetails: (opts.extra && opts.extra.abmahnungDetails) || '[Zahlungseingänge mit Datum eintragen]'
      });
      const raten = (opts.extra && opts.extra.raten) || fall.raten || [];
      ctx.ratenTabelle = tabelle(['Rate', 'fällig am', 'Betrag'], raten.map(r => [r.nr + '.', fmtDatum(r.faellig), fmtEUR(r.betrag)]), ['', 'Summe', fmtEUR(C.sum(raten, r => r.betrag))], [2]);
      ctx.ratenListe = raten.map(r => r.nr + '. Rate am ' + fmtDatum(r.faellig) + ': ' + fmtEUR(r.betrag)).join('\n');
      ctx.ratenSumme = fmtEUR(C.sum(raten, r => r.betrag));
    }
    if (opts.bereich === 'ih') {
      const ang = (fall.angebote || []).find(a => a.kontaktId === fall.handwerkerId) || (fall.angebote || [])[0];
      Object.assign(ctx, {
        schaden: Object.assign({}, fall, { gemeldetAm: fmtDatum(fall.gemeldetAm), dringlichkeitText: C.IH_DRINGLICHKEIT[fall.dringlichkeit] || '' }),
        terminText: fall.termin ? fmtDatum(fall.termin) + (fall.terminZeit ? ', ' + fall.terminZeit + ' Uhr' : '') : 'wird noch mit Ihnen abgestimmt',
        angebotText: ang ? 'Ihr Angebot vom ' + fmtDatum(ang.datum) + ' über ' + fmtEUR(ang.betrag) + (ang.nr ? ' (Nr. ' + ang.nr + ')' : '') : 'nach Aufwand, Kostenrahmen bitte vorab abstimmen',
        rechnung: Object.assign({ nr: '', datum: '' }, fall.rechnung || {}, { datum: fmtDatum((fall.rechnung || {}).datum) }),
        weiterbelastungBetrag: fmtEUR(fall.weiterbelastung || (fall.rechnung || {}).betrag || 0)
      });
    }
    if (opts.bereich === 'kaution') {
      const r = C.kautionsabrechnung(fall);
      const zeilen = [['Kaution', fmtEUR(r.kaution)], ['zzgl. Zinsen', fmtEUR(r.zinsen)]];
      (fall.einbehalte || []).forEach(e => zeilen.push(['abzgl. ' + e.grund, '-' + fmtEUR(e.betrag)]));
      if (r.nkEinbehalt) zeilen.push(['abzgl. Einbehalt Betriebskosten (vorläufig)', '-' + fmtEUR(r.nkEinbehalt)]);
      if (r.bereitsAusgezahlt) zeilen.push(['abzgl. bereits ausgezahlt', '-' + fmtEUR(r.bereitsAusgezahlt)]);
      const teil = C.round2(r.guthaben - r.einbehalte - r.nkEinbehalt - r.bereitsAusgezahlt);
      Object.assign(ctx, {
        kaution: Object.assign({}, fall, { betrag: fmtEUR(r.kaution), auszahlung: fmtEUR(r.auszahlung), uebergabeAm: fmtDatum(fall.uebergabeAm || fall.auszugAm), auszahlungIban: fall.auszahlungIban || '[IBAN fehlt]' }),
        kautionTabelle: tabelle(['Position', 'Betrag'], zeilen, [r.auszahlung >= 0 ? 'Auszahlungsbetrag' : 'Nachforderung', fmtEUR(Math.abs(r.auszahlung))], [1]),
        kautionListe: zeilen.map(z => z[0] + ': ' + z[1]).join('\n') + '\n' + (r.auszahlung >= 0 ? 'Auszahlung: ' : 'Nachforderung: ') + fmtEUR(Math.abs(r.auszahlung)),
        auszahlungSatz: r.auszahlung > 0 ? 'Den Betrag von ' + fmtEUR(r.auszahlung) + ' überweisen wir in den nächsten Tagen auf Ihr Konto ' + (fall.auszahlungIban || '[IBAN fehlt]') + '.'
          : r.auszahlung < 0 ? 'Es ergibt sich eine Forderung zu Ihren Lasten in Höhe von ' + fmtEUR(-r.auszahlung) + '. Wir bitten um Ausgleich bis zum ' + fmtDatum(opts.frist || C.addDays(C.today(), 14)) + ' auf das unten genannte Konto.' : 'Es ergibt sich kein Auszahlungsbetrag.',
        nkSatz: r.nkEinbehalt ? '\n\nFür die noch ausstehende Betriebskostenabrechnung behalten wir vorläufig ' + fmtEUR(r.nkEinbehalt) + ' ein. Nach Vorliegen der Abrechnung' + (fall.nkDatum ? ' (voraussichtlich ' + fmtDatum(fall.nkDatum) + ')' : '') + ' rechnen wir diesen Betrag gesondert ab.' : '',
        teilauszahlungBetrag: fmtEUR(teil > 0 ? teil : 0)
      });
    }
    if (opts.extra) Object.keys(opts.extra).forEach(k => { if (typeof opts.extra[k] === 'string') ctx[k] = opts.extra[k]; });
    ctx._empfaenger = opts.empfaengerKontakt || (STANDARD[opts.vorlageId] && STANDARD[opts.vorlageId].empfaenger === 'handwerker') ? kontaktAdresse(hw) : adresse(mieter, objekt);
    ctx._email = STANDARD[opts.vorlageId] && STANDARD[opts.vorlageId].empfaenger === 'handwerker' ? (hw && hw.email) || '' : (mieter && mieter.email) || '';
    ctx._zeichen = mieter && mieter.mietnr ? mieter.mietnr : '';
    return ctx;
  }

  /* ---------- Briefrahmen DIN 5008 (Form B) ---------- */
  const BRIEF_CSS = `
  .brief{font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:11pt;line-height:1.35;color:#000;background:#fff;width:210mm;min-height:296mm;box-sizing:border-box;padding:0 20mm 28mm 25mm;position:relative}
  .brief *{box-sizing:border-box}
  .brief .kopf{height:45mm;padding-top:12mm;display:flex;justify-content:space-between;align-items:flex-start}

  .brief .kopf .fz{font-size:9pt;color:#444}
  .brief .kopf img{max-height:22mm;max-width:60mm}
  .brief .fenster{display:flex;justify-content:space-between;height:45mm}

  function briefHTML(data, v, ctx) {
    const s = data.settings;
    const betreff = C.vorlageZuText(v.betreff, ctx);
    const body = C.vorlageZuHTML(v.text, ctx);
    const kopfLinks = s.logo ? '<img src="' + s.logo + '" alt="">' : '<div><div class="fn">' + esc(s.firma) + '</div><div class="fz">Hausverwaltung</div></div>';
    const kopfRechts = '<div class="fz" style="text-align:right">' + esc(s.firma) + '<br>' + esc(s.strasse) + '<br>' + esc(s.plzort) + '<br>Tel. ' + esc(s.tel) + '<br>' + esc(s.mail) + (s.web ? '<br>' + esc(s.web) : '') + '</div>';
    const info = [['Unser Zeichen', ctx._zeichen], ['Ansprechpartner', s.sachbearbeiter], ['Telefon', s.tel], ['E-Mail', s.mail], ['Datum', ctx.datum]]
      .filter(r => r[1]).map(r => '<tr><td>' + esc(r[0]) + ':</td><td>' + esc(r[1]) + '</td></tr>').join('');
    const unterschrift = v.unterschrift
      ? '<div class="sig"></div><span class="siglinie">' + esc(s.unterzeichner) + (s.funktion ? ', ' + esc(s.funktion) : '') + '<br>' + esc(s.firma) + '</span>'
      : '<br><br>' + esc(s.sachbearbeiter) + '<br>' + esc(s.firma);
    const mieterSig = v.mieterUnterschrift ? '<div class="sigzeile"><span class="siglinie">Ort, Datum</span><span class="siglinie">Unterschrift Mieter/in (' + esc(ctx.mieter.name) + ')</span></div>' : '';
    const iban = (s.ibanJeEigentuemer && ctx.objekt && ctx.objekt.iban) ? ctx.objekt.iban : s.iban;
    return '<div class="brief">' +
      '<div class="kopf">' + kopfLinks + kopfRechts + '</div>' +
      '<div class="fenster"><div class="anschrift"><div class="ruecksende">' + esc(s.firma) + ' · ' + esc(s.strasse) + ' · ' + esc(s.plzort) + '</div>' +
      (ctx._empfaenger || []).map(esc).join('<br>') + '</div><table class="info">' + info + '</table></div>' +
      '<div class="betreff">' + esc(betreff) + '</div>' + body +
      '<div class="gruss">Mit freundlichen Grüßen' + unterschrift + mieterSig + '</div>' +
      '<div class="fuss"><div>' + esc(s.firma) + '<br>' + esc(s.strasse) + ', ' + esc(s.plzort) + '</div><div>Tel. ' + esc(s.tel) + '<br>' + esc(s.mail) + '</div><div>' + esc(s.bank) + '<br>IBAN ' + esc(iban) + (s.bic ? ' · BIC ' + esc(s.bic) : '') + '</div></div>' +
      '</div>';
  }

  /** Dokument erzeugen → { html, betreff, emailText, email, dateiname } */
  function erzeuge(data, vorlageId, opts) {
    const v = vorlage(data, vorlageId);
    const ctx = kontext(data, Object.assign({ vorlageId }, opts));
    const betreff = C.vorlageZuText(v.betreff, ctx);
    const name = ctx.mieter && ctx.mieter.nachname ? ctx.mieter.nachname : (ctx.handwerker && ctx.handwerker.firma) || '';
    return {
      vorlageId, titel: v.titel, html: briefHTML(data, v, ctx), betreff, emailText: C.vorlageZuText(v.email || '', ctx),
      email: opts.empfaengerKontakt ? opts.empfaengerKontakt.email || '' : ctx._email,
      dateiname: C.asciiDateiname(C.today() + ' ' + v.titel.replace(/\(.*\)/, '').trim() + (name ? ' ' + name : ''))
    };
  }

  function standalone(inner, titel) {
    return '<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>' + esc(titel || 'Dokument') + '</title><style>@page{size:A4;margin:0}body{margin:0;background:#fff}' + BRIEF_CSS +
      '@media print{.brief{page-break-after:always}}</style></head><body>' + inner + '</body></html>';
  }

  /* ---------- Export ---------- */
  function download(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function drucken(html, titel) {
    const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    f.contentDocument.open(); f.contentDocument.write(standalone(html, titel)); f.contentDocument.close();
    setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 2000); }, 300);
  }
  function word(html, name) {
    const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">' +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
      '<style>@page WordSection1{size:21cm 29.7cm;margin:1.5cm 2cm 2cm 2.5cm}div.WordSection1{page:WordSection1}body{font-family:Calibri;font-size:11pt}' +
      BRIEF_CSS.replace(/\.brief\{[^}]*\}/, '.brief{font-family:Calibri;font-size:11pt}').replace(/\.brief \.fuss\{[^}]*\}/, '.brief .fuss{border-top:.5pt solid #999;margin-top:10mm;font-size:7.5pt;color:#444}').replace(/display:flex;?/g, '') +
      '</style></head><body><div class="WordSection1">' + html + '</div></body></html>';
    download(new Blob(['﻿' + doc], { type: 'application/msword' }), name + '.doc');
  }
  async function pdfBlob(html) {

        ws['!cols'] = b.kopf.map((k, i) => ({ wch: Math.min(60, Math.max(String(k).length, ...b.zeilen.map(z => String(z[i] == null ? '' : z[i]).length)) + 2) }));

      });
      X.writeFile(wb, C.asciiDateiname(name) + '.xlsx');

    } catch (e) {

      const cell = v => { const s = typeof v === 'number' ? C.fmtZahl(v) : String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const csv = [b.kopf, ...b.zeilen].map(z => z.map(cell).join(';')).join('\r\n');

  /** Alle Blätter einer Excel-Datei (Rohwerte, Datumswerte als Date) bzw. eine CSV → [{ name, rows }] */
  async function leseArbeitsmappe(file) {
    const leer = r => r.some(c => c != null && String(c).trim() !== '');
    if (/\.(xlsx|xlsm|xlsb|xls|ods)$/i.test(file.name)) {
      const X = await loadLib('xlsx', 'XLSX');
      const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true, cellStyles: true });
      // ausgeblendete Zeilen (z. B. erledigte Aufgaben) werden ignoriert
      return wb.SheetNames.map(n => {
        const ws = wb.Sheets[n]; if (!ws['!ref']) return { name: n, rows: [], zeilen: [], ausgeblendet: 0 };
        const start = X.utils.decode_range(ws['!ref']).s.r, info = ws['!rows'] || [];
        const alle = X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
        const rows = [], zeilen = []; let ausgeblendet = 0;
        alle.forEach((r, i) => { const nr = start + i; if (info[nr] && info[nr].hidden) { ausgeblendet++; return; } if (leer(r)) { rows.push(r); zeilen.push(nr + 1); } });
        return { name: n, rows, zeilen, ausgeblendet };
      });
    }
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('\ufffd')) text = new TextDecoder('windows-1252').decode(buf);
    return [{ name: file.name, rows: C.parseCSV(text) }];

      try { lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(await (await fetch(CDN.pdfjsWorker)).blob()); }
      catch (e) { lib.GlobalWorkerOptions.workerSrc = CDN.pdfjsWorker; }
    }
    const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const seiten = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const tc = await (await doc.getPage(i)).getTextContent();
      seiten.push(tc.items.map(it => ({ x: it.transform[4], y: it.transform[5], s: it.str })));
      if (fortschritt) fortschritt(i, doc.numPages);
    }
    return seiten;
  }

  /* ---------- Dokument: Vorschau + Export + Verbuchen ---------- */
  /**
   * o: { vorlageId, bereich, fall, frist (ISO|undefined), extra, empfaengerKontakt,
   *      aktion, aktionCtx(frist) → ctx, nachVerbuchen(frist), verlaufText }
   */
  App.dokument = async function (o) {
    let frist = o.frist || '';
    let doc;
    const gen = () => { doc = D.erzeuge(App.data, o.vorlageId, { bereich: o.bereich, fall: o.fall, frist, extra: o.extra, empfaengerKontakt: o.empfaengerKontakt }); };
    gen();
    let exportiert = false;
    const hatFrist = o.frist !== undefined;
    const body = '<div class="doctool">' + (hatFrist ? '<label>Frist <input type="date" id="docFrist" value="' + esc(frist) + '"></label>' : '') +
      '<label class="grow">E-Mail an <input type="email" id="docTo" value="' + esc(doc.email) + '" placeholder="E-Mail-Adresse"></label>' +
      '<span class="muted small">Text in der Vorschau direkt bearbeitbar (vor Export).</span></div><iframe id="docFrame" class="docframe" title="Vorschau"></iframe>';
    const r = await modal({
      title: doc.titel + ' – Vorschau', wide: true, cls: 'docdlg', body,
      buttons: [{ label: 'Schließen', value: '' }, ...(o.aktion ? [{ label: 'Nur verbuchen', value: 'book', cls: 'ghost' }] : []),
        { label: '🖨 Drucken', value: 'print', type: 'button' }, { label: 'Word', value: 'word', type: 'button' }, { label: 'PDF', value: 'pdf', type: 'button' },
        { label: '✉ PDF + E-Mail-Entwurf', value: 'mail', type: 'button', cls: 'primary' }],
      onOpen(d) {
        const fr = d.querySelector('#docFrame');
        const load = () => { fr.srcdoc = D.standalone(doc.html, doc.titel).replace('<body>', '<body contenteditable="true" spellcheck="true" style="background:#dfe4ea;padding:12px">'); };
        load();
        const fi = d.querySelector('#docFrist'); if (fi) fi.onchange = () => { frist = fi.value; gen(); load(); };
        const aktuell = () => { const el = fr.contentDocument && fr.contentDocument.querySelector('.brief'); return el ? el.outerHTML : doc.html; };
        $$('footer button[type=button][value]', d).forEach(btn => {
          btn.onclick = async () => {
            btn.disabled = true; const html = aktuell();
            try {
              if (btn.value === 'print') D.drucken(html, doc.titel);
              if (btn.value === 'word') D.word(html, doc.dateiname);
              if (btn.value === 'pdf') { toast('PDF wird erstellt …'); await D.pdf(html, doc.dateiname); }
              if (btn.value === 'mail') {
                const to = d.querySelector('#docTo').value;
                if (!to) toast('Keine E-Mail-Adresse hinterlegt – Entwurf ohne Empfänger.', 'warn');
                const res = await D.emailEntwurf(Object.assign({}, doc, { html }), to);
                toast(res.art === 'eml' ? 'E-Mail-Entwurf (.eml) gespeichert – per Doppelklick öffnen, Outlook zeigt ihn als Entwurf mit PDF-Anhang.'
                  : 'PDF-Bibliothek nicht verfügbar (' + res.fehler + '). Word-Datei gespeichert, E-Mail-Text in der Zwischenablage, Mailprogramm geöffnet.', res.art === 'eml' ? 'ok' : 'warn', 9000);
              }
              exportiert = true;
            } catch (e) { toast('Fehler: ' + e.message + ' – Word und Drucken funktionieren auch offline.', 'err', 8000); }
            finally { btn.disabled = false; }
          };
        });
      }
    });
    const buchen = r.action === 'book' || (exportiert && o.aktion && await confirmDlg('Schreiben „' + esc(doc.titel) + '“ als versendet verbuchen?<br><small class="muted">Legt einen Verlaufseintrag und die Wiedervorlage(n) automatisch an.</small>', 'Ja, verbuchen', 'Nein'));
    if (buchen && o.aktion) {
      const res = C.applyAction(App.data, o.bereich, o.fall.id, o.aktion, Object.assign({ frist: frist || undefined }, o.aktionCtx ? o.aktionCtx(frist) : {}));
      if (o.nachVerbuchen) o.nachVerbuchen(frist);
      App.commit();
      toast('Verbucht. ' + (res.neu.length ? 'WV: ' + res.neu.map(w => fmtDatum(w.datum)).join(', ') : ''));
      return true;
    }
    if (exportiert && !o.aktion && o.fall) {
      C.addVerlauf(App.data, o.bereich, o.fall.id, 'schreiben', o.verlaufText || (doc.titel + ' erstellt'));
      if (o.nachVerbuchen) o.nachVerbuchen(frist);
      App.commit();
    }
    return exportiert;
  };

      const cnt = { ueber: offen.filter(w => w.datum < t).length, heute: offen.filter(w => w.datum === t).length, w7: offen.filter(w => w.datum > t && w.datum <= C.addDays(t, 7)).length };
      const rueck = C.sum(d.opos.filter(x => x.stufe !== 'erledigt'), x => C.offenSumme(x.posten));
      const vt = Number(UI().verjaehrungWarnTage) || 30;
      const kVerj = d.kaution.filter(k => k.status !== 'ausgezahlt' && (C.verjaehrung(k) || { restTage: 9999 }).restTage < vt);
      const zeig = UI().kacheln || [];
      let list = offen;
      if (f.zeit === 'ueber') list = list.filter(w => w.datum < t);
      else if (f.zeit === 'heute') list = list.filter(w => w.datum === t);
      else if (f.zeit === 'faellig') list = list.filter(w => w.datum <= t);
      else if (f.zeit === '7') list = list.filter(w => w.datum <= C.addDays(t, 7));
      else if (f.zeit === '30') list = list.filter(w => w.datum <= C.addDays(t, 30));
      else if (f.zeit === 'erledigt') list = d.wv.filter(w => w.status === 'erledigt').sort((a, b) => (b.erledigtAm || '').localeCompare(a.erledigtAm || '')).slice(0, 200);
      list = list.filter(w => (!f.bereich || w.bereich === f.bereich) && inObj(w));
      if (f.zeit !== 'erledigt') list.sort((a, b) => a.datum.localeCompare(b.datum));
      const kachel = (n, l, cls, act) => '<button class="kachel ' + cls + '" ' + act + '><b>' + n + '</b><span>' + l + '</span></button>';
      const lb = d.meta.lastBackup;

      return (backupAlt && (d.opos.length + d.ih.length + d.kaution.length) ? '<div class="banner warn">💾 ' + (lb ? 'Letztes Backup am ' + fmtDatum(lb) + '.' : 'Noch kein Backup erstellt.') +
        ' Die Daten liegen nur in diesem Browser – bitte wöchentlich sichern. <button data-act="backupExport">Jetzt Backup speichern</button></div>' : '') +
        '<div class="kacheln">' +
        [['ueber', () => kachel(cnt.ueber, 'überfällig', cnt.ueber ? 'rot' : '', 'data-act="dashZeit" data-z="ueber"')],
         ['heute', () => kachel(cnt.heute, 'heute fällig', cnt.heute ? 'gelb' : '', 'data-act="dashZeit" data-z="heute"')],
         ['w7', () => kachel(cnt.w7, 'in 7 Tagen', '', 'data-act="dashZeit" data-z="7"')],
         ['opos', () => kachel(offen.filter(w => w.bereich === 'opos').length, 'WV OPOS', 'b-opos', 'data-act="dashBereich" data-b="opos"')],
         ['ih', () => kachel(offen.filter(w => w.bereich === 'ih').length, 'WV Instandhaltung', 'b-ih', 'data-act="dashBereich" data-b="ih"')],
         ['kaution', () => kachel(offen.filter(w => w.bereich === 'kaution').length, 'WV Kaution', 'b-kaution', 'data-act="dashBereich" data-b="kaution"')],
         ['rueck', () => kachel(fmtEUR(rueck), 'Rückstand gesamt', rueck ? 'rot-t' : '', 'data-act="tab" data-tab="opos"')],
         ['verj', () => kachel(kVerj.length, 'Kautionen: Verjährung < ' + vt + ' T', kVerj.length ? 'rot' : '', 'data-act="tab" data-tab="kaution"')]]
          .filter(([k]) => zeig.includes(k)).map(([, f2]) => f2()).join('') +
        '</div>' +
        '<section class="card"><div class="toolbar"><h2>Wiedervorlagen</h2>' +
        '<select data-filter="dash.zeit">' + [['faellig', 'fällig (bis heute)'], ['ueber', 'überfällig'], ['heute', 'heute'], ['7', 'nächste 7 Tage'], ['30', 'nächste 30 Tage'], ['alle', 'alle offenen'], ['erledigt', 'erledigte']]
          .map(([v, l]) => '<option value="' + v + '"' + (f.zeit === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
        '<select data-filter="dash.bereich"><option value="">alle Bereiche</option>' + Object.entries(C.BEREICHE).map(([v, l]) => '<option value="' + v + '"' + (f.bereich === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
        '<select data-filter="dash.objekt"><option value="">alle Objekte</option>' + H.objektOptionen(false).map(([v, l]) => '<option value="' + v + '"' + (f.objekt === v ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>' +
        '<span class="sp"></span><button data-act="wvNeu">+ WV</button><button data-act="tagesliste">🖨 Tagesliste</button><button data-act="wvExcel">WV-Liste Excel</button></div>' +
        App.wvTabelle(list, { leer: f.zeit === 'faellig' ? 'Nichts fällig – alles erledigt. 🎉' : 'Keine Einträge für diesen Filter.' }) + '</section>';
    }

  function neuerFall(mieterId) {
    const f = { id: C.uid(), mieterId, stufe: 'neu', posten: [], raten: [], notiz: '', angelegt: C.today() };
    App.data.opos.push(f);
    C.addVerlauf(App.data, 'opos', f.id, 'angelegt', 'Fall angelegt');
    C.createWV(App.data, 'opos', f.id, C.today(), 'Offene Posten prüfen – Zahlungserinnerung versenden?', { regel: 'opos:neu' });
    return f;
  }

  Object.assign(App.change, {
    oposSel(el) { App.f.opos.sel[el.dataset.id] = el.checked; App.render(); },
    oposSelAll(el) { $$('input[data-change=oposSel]').forEach(c => { App.f.opos.sel[c.dataset.id] = el.checked; }); App.render(); },
    oposNotiz(el) { const f = H.fall('opos', el.dataset.id); f.notiz = el.value; App.save(); App.toast('Notiz gespeichert.'); },
    rateBezahlt(el) {
      const f = H.fall('opos', el.dataset.id); const r = f.raten[+el.dataset.i]; r.bezahlt = el.checked;
      if (el.checked) rateWVSchliessen(f, r);
      C.addVerlauf(App.data, 'opos', f.id, 'rate', 'Rate ' + r.nr + ' (' + fmtEUR(r.betrag) + ') als ' + (el.checked ? 'bezahlt' : 'offen') + ' markiert');
      App.commit();
    }
  });

  function rateWVSchliessen(f, r) {
    App.data.wv.forEach(w => { if (w.bereich === 'opos' && w.refId === f.id && w.status === 'offen' && w.regel === 'opos:raten' && w.aufgabe.startsWith('Rate ' + r.nr + '/')) { w.status = 'erledigt'; w.erledigtAm = C.today(); } });
  }
  // Klick auf Checkbox in der Zeile soll den Fall nicht öffnen
  document.addEventListener('click', e => { if (e.target.closest('[data-stop]')) e.stopPropagation(); }, true);

  Object.assign(App.act, {
    async oposNeu() {

      if (!v) return;
      let mid = v.mieterId;
      if (v._action === 'neuMieter' || !mid) { const m = await App.act.mieterEdit({}); if (!m) return; mid = m.id; }
      const exist = App.data.opos.find(f => f.mieterId === mid && f.stufe !== 'erledigt');
      if (exist) { App.toast('Für diesen Mieter gibt es bereits einen aktiven Fall.', 'warn'); return App.act.openFall({ b: 'opos', id: exist.id }); }
      const f = neuerFall(mid);
      if (v.mieten > 0) mietenAnlegen(f, v.ab + '-01', +v.mieten, (H.mieter(mid) || {}).gesamtmiete || 0);
      App.tab = 'opos'; App.detail = f.id; App.commit();

    async oposDel(ds) {

      d.wv = d.wv.filter(w => !(w.bereich === 'opos' && w.refId === ds.id)); d.verlauf = d.verlauf.filter(w => !(w.bereich === 'opos' && w.refId === ds.id));
      App.detail = null; App.commit();

    async postenEdit(ds) {
      const f = H.fall('opos', ds.id); const p = ds.p ? f.posten.find(x => x.id === ds.p) : null;
      const m = H.mieter(f.mieterId) || {};
      const v = await App.formModal(p ? 'Posten bearbeiten' : 'Neuer Posten', [
        { k: 'bez', l: 'Bezeichnung', req: true, full: true, list: 'dl_posten' }, { k: 'faellig', l: 'Fällig am', t: 'date', req: true },
        { k: 'typ', l: 'Typ', t: 'select', o: [['miete', 'Miete (zählt für Kündigung)'], ['sonstig', 'Sonstig (NK-Nachzahlung, Kosten …)'], ['gutschrift', 'Gutschrift / Zahlung (Betrag negativ)']] },
        { k: 'betrag', l: 'Betrag (€)', t: 'money', req: true }, { k: 'offen', l: 'davon offen (€)', t: 'money', hint: 'leer = voller Betrag' }
      ], p || { typ: 'miete', betrag: m.gesamtmiete || '', faellig: C.today() }, {
        outro: '<datalist id="dl_posten"><option value="Miete ' + C.today().slice(5, 7) + '/' + C.today().slice(0, 4) + '"><option value="Nebenkostennachzahlung"><option value="Mahnkosten"><option value="Rücklastschriftgebühr"></datalist>'
      });
      if (!v) return;
      const offen = v.offen === 0 && !p ? v.betrag : v.offen;
      if (p) Object.assign(p, { bez: v.bez, faellig: v.faellig, typ: v.typ, betrag: v.betrag, offen });
      else { f.posten.push({ id: C.uid(), bez: v.bez, faellig: v.faellig, typ: v.typ, betrag: v.betrag, offen }); C.addVerlauf(App.data, 'opos', f.id, 'posten', 'Posten „' + v.bez + '“ ' + fmtEUR(v.betrag) + ' erfasst'); }
      App.commit();

    async oposMieten(ds) {
      const f = H.fall('opos', ds.id); const m = H.mieter(f.mieterId) || {};
      const v = await App.formModal('Monatsmieten als offene Posten anlegen', [
        { k: 'ab', l: 'ab Monat', t: 'month', req: true, d: C.today().slice(0, 7) }, { k: 'anzahl', l: 'Anzahl Monate', t: 'number', min: 1, d: 1, req: true },
        { k: 'betrag', l: 'Betrag je Monat (€)', t: 'money', d: m.gesamtmiete || 0, req: true }], {}, { ok: 'Anlegen' });
      if (!v) return; mietenAnlegen(f, v.ab + '-01', +v.anzahl, v.betrag); App.commit();
    },
    async oposZahlung(ds) {
      const f = H.fall('opos', ds.id); const offen = C.offenSumme(f.posten);
      const v = await App.formModal('Zahlung verbuchen', [
        { k: 'betrag', l: 'Betrag (€)', t: 'money', req: true, d: offen }, { k: 'datum', l: 'Zahlungseingang am', t: 'date', req: true, d: C.today() },
        { k: 'notiz', l: 'Notiz', full: true }], {}, { ok: 'Verbuchen', intro: '<p class="muted">Die Zahlung wird auf die ältesten offenen Posten verrechnet. Offen: <b>' + fmtEUR(offen) + '</b></p>' });
      if (!v || !(v.betrag > 0)) return;
      const r = C.verteileZahlung(f.posten, v.betrag);
      f.posten = r.posten;
      C.addVerlauf(App.data, 'opos', f.id, 'zahlung', 'Zahlung ' + fmtEUR(v.betrag) + ' verbucht: ' + r.buchungen.map(b => b.bez + ' ' + fmtEUR(b.betrag)).join(', ') + (r.rest ? ' · Überzahlung ' + fmtEUR(r.rest) : '') + (v.notiz ? ' · ' + v.notiz : ''), v.datum);
      let rest = v.betrag;
      (f.raten || []).filter(x => !x.bezahlt).forEach(x => { if (rest + 0.005 >= x.betrag) { x.bezahlt = true; rest = C.round2(rest - x.betrag); rateWVSchliessen(f, x); } });
      App.commit();
      if (C.offenSumme(f.posten) <= 0 && f.stufe !== 'erledigt') {
        if (await App.confirm('Alle Posten sind ausgeglichen. Fall als erledigt abschließen? (offene automatische WV werden geschlossen)', 'Ja, erledigt', 'Nein')) {
          C.applyAction(App.data, 'opos', f.id, 'erledigt', {}); App.commit();
        }
      } else App.toast('Zahlung verbucht. Noch offen: ' + fmtEUR(C.offenSumme(f.posten)));
    },
    async oposBrief(ds) {
      const f = H.fall('opos', ds.id), st = ds.v, m = H.mieter(f.mieterId) || {};
      if (!C.offenSumme(f.posten) && st !== 'abmahnung') return App.toast('Keine offenen Posten – kein Mahnschreiben nötig.', 'warn');
      const extra = {};
      if (st === 'kuendigung') {
        const ch = C.kuendigungsCheck(f.posten, m.gesamtmiete);
        const ok = await App.confirm('<div class="pruef ' + (ch.moeglich ? '' : 'rot') + '"><b>Kündigungscheck:</b> ' + esc(ch.text) + '<br><small>' + esc(ch.hinweis) + '</small></div>' +
          '<ul class="small"><li>Die Kündigung bedarf der <b>Schriftform</b> (§ 568 Abs. 1 BGB): Original unterschrieben per Post/Boten, E-Mail nur „vorab“.</li>' +
          '<li>Vollmacht im Original beilegen (§ 174 BGB).</li><li>Alle Mieter laut Mietvertrag als Empfänger – ggf. Anschrift anpassen.</li>' +
          '<li>Schonfristzahlung: vollständiger Ausgleich bis 2 Monate nach Rechtshängigkeit der Räumungsklage macht die fristlose Kündigung unwirksam.</li></ul>' +
          (ch.moeglich ? '' : '<p><b>Die Voraussetzungen scheinen nicht erfüllt. Trotzdem fortfahren?</b></p>'), 'Schreiben erstellen', 'Abbrechen', 'Kündigung vorbereiten');
        if (!ok) return;

      if (st === 'abmahnung') {

          '<div class="grid"><label class="fld"><span>Ausgabe</span><select name="ausgabe"><option value="druck">Alle Briefe in einem Druckauftrag</option><option value="word">Alle Briefe als eine Word-Datei</option>' +
          '<option value="pdf">Einzelne PDF-Dateien</option><option value="mail">E-Mail-Entwürfe (.eml mit PDF), sonst Druck</option></select></label>' +
          '<label class="chk"><input type="checkbox" name="buchen" checked> nach Ausgabe als versendet verbuchen (WV anlegen)</label></div>',
        buttons: [{ label: 'Abbrechen', value: '' }, { label: 'Mahnlauf starten', value: 'ok', cls: 'primary' }]
      });
      if (r.action !== 'ok') return;
      const jobs = faelle.map(f => ({ f, st: r.values['st_' + f.id] })).filter(j => j.st);
      const docs = jobs.map(j => { const frist = C.addDays(C.today(), Number(d.settings.fristen[j.st]) || 10); return Object.assign(j, { frist, doc: D.erzeuge(d, j.st, { bereich: 'opos', fall: j.f, frist }) }); });
      const ohneMail = [];
      if (r.values.ausgabe === 'druck') D.drucken(docs.map(x => x.doc.html).join(''), 'Mahnlauf ' + fmtDatum(C.today()));

        if (r.values.ausgabe === 'mail') {
          for (const x of docs) { if (x.doc.email) await D.emailEntwurf(x.doc, x.doc.email); else ohneMail.push(x); }

    async oposExcel() {
      const zeilen = [];

        f.posten.filter(p => p.offen > 0).forEach(p => zeilen.push([m.mietnr || '', C.mieterName(m), o.bezeichnung || '', m.whg || '', S[f.stufe], p.bez, fmtDatum(p.faellig), p.typ, p.betrag, p.offen, wv ? fmtDatum(wv.datum) : '', wv ? wv.aufgabe : '']));
      });
